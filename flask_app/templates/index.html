<!DOCTYPE html>
    <head>
        <title>ISS Tracker</title>
        <link rel="image_src" href="{{ url_for('static', filename='img/srcimg.jpg') }}">
        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ==" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js" integrity="sha512-gZwIG9x3wUXg2hdXF6+rVkLF/0Vi9U8D2Ntg4Ga5I5BZpVkVxlJWbSQtXPSiUTtC0TjtGOmxa1AJPuV0CPthew==" crossorigin=""></script>
        <script src="https://cdn.jsdelivr.net/npm/d3@3.5.17/d3.min.js" integrity="sha384-N8EP0Yml0jN7e0DcXlZ6rt+iqKU9Ck6f1ZQ+j2puxatnBq4k9E8Q6vqBcY34LNbn" crossorigin="anonymous"></script>
        <meta name="mapbox-key" content="{{ mapboxKey }}">
    </head>
    <body>
        <div class="header">
            <img class="header-img" src="{{ url_for('static', filename='img/bluestar.svg') }}" />
            <h1 class="title">ISS Tracker</h1>
            <img class="header-img" src="{{ url_for('static', filename='img/bluestar.svg') }}" />
        </div>
        <div id="mapid"></div>
        <div class="border-blue">
            <div id="data-point-select">
                <p id="data-point-select-msg">Initial Data Points:</p>
                <input type="number" id="data-point-quantity" name="data-point-quantity" min="2" max="500" value="100">
                <input type="submit" id="data-point-submit">
            </div>
            <div id="header-buttons">
                <button class="header-button" id="toggle-style">Toggle Style</button>
                <button class="header-button" id="toggle-markers">Toggle Markers</button>
                <button class="header-button" id="toggle-lines">Toggle Lines</button>
                <button class="header-button" data-href="/data-table">Data Table</button>
            </div>
        </div>
        <div class="header">
            <img class="header-img" src="{{ url_for('static', filename='img/bluestar.svg') }}" />
            <h1 class="title">Today's Records</h1>
            <img class="header-img" src="{{ url_for('static', filename='img/bluestar.svg') }}" />
        </div>
        <div class="border-blue">
            <div id="single-data-points">
                <div class="single-data-point">
                    <p class="single-data-msg">Average Speed of ISS</p>
                    <h3 id="avgSpeed" class="single-data-title" />
                </div>
                <div class="single-data-point">
                    <p class="single-data-msg">Average Temperature of flyover locations</p>
                    <h3 id="avgTemp" class="single-data-title" />
                </div>
            </div>
        </div>
        <div id="weather-counts">
            <h2 class="subtitle">Most Common Weather</h2>
            <table id="weather-counts-table"></table>
            <div id="weather-counts-div"></div>
        </div>
        <div id="country-counts">
            <h2 class="subtitle">Most Visited Countries</h2>
            <table id="country-counts-table"></table>
            <div id="country-counts-div"></div>
        </div>
        <div class="header">
            <img class="header-img" src="{{ url_for('static', filename='img/bluestar.svg') }}" />
            <h1 class="title">Thanks For Stopping By</h1>
            <img class="header-img" src="{{ url_for('static', filename='img/bluestar.svg') }}" />
        </div>
    </body>
    <footer>
        <script src="{{ url_for('static', filename='js/timeutil.js') }}"></script>
        <script src="{{ url_for('static', filename='js/countryutil.js') }}"></script>
        <script src="{{ url_for('static', filename='js/tablecreator.js') }}"></script>
        <script src="{{ url_for('static', filename='js/app.js') }}"></script>
        <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
    </footer>
</html>
